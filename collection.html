<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Digital Collection of Loss</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    .field-value {
      transition: none;
      filter: blur(0px);
      opacity: 1;
      letter-spacing: normal;
      will-change: filter, opacity, letter-spacing;
    }
    .is-decaying .field-value {
      transition: filter 15s linear, opacity 15s linear, letter-spacing 15s linear;
      filter: blur(10px);
      opacity: 0;
      letter-spacing: 0.4em;
    }
    .field-value-delayed {
      transition: none;
      filter: blur(0px);
      opacity: 1;
      letter-spacing: normal;
      will-change: filter, opacity, letter-spacing;
    }
    .is-decaying .field-value-delayed {
      transition: filter 15s cubic-bezier(0.85, 0, 1, 1),
                  opacity 15s cubic-bezier(0.85, 0, 1, 1),
                  letter-spacing 15s cubic-bezier(0.85, 0, 1, 1);
      filter: blur(10px);
      opacity: 0;
      letter-spacing: 0.4em;
    }
  </style>
</head>
<body class="bg-slate-950 min-h-screen p-8 antialiased text-slate-100">

  <!-- Header Section -->
  <header class="max-w-6xl mx-auto mb-10 border-b border-slate-800 pb-5">
    <h1 class="text-3xl font-bold tracking-tight text-slate-100">The Digital Collection of Loss</h1>
    <p class="text-sm text-slate-400 mt-1">Encounters with a single subject.</p>
  </header>

  <!-- Dynamic Grid Container for Records -->
  <main id="collectionGrid" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <!-- Cards will be dynamically injected here -->
  </main>

  <!-- Error State Container (Hidden by default) -->
  <div id="errorMessage" class="max-w-md mx-auto mt-20 bg-slate-900 border border-slate-800 rounded-xl p-6 text-center shadow-xl space-y-2 hidden font-mono text-sm">
    <p class="font-bold text-slate-200">records.json did not load.</p>
    <p class="text-slate-400">Are you serving the folder?</p>
    <p class="text-slate-300 pt-1">Open <a href="http://localhost:8000" class="underline hover:text-white font-semibold">http://localhost:8000</a></p>
  </div>

  <script>
    // Helper to parse simple CSV text into rows & headers
    function parseCSV(text) {
      const lines = text.trim().split('\n').map(line => line.split(',').map(item => item.trim()));
      const headers = lines[0] || [];
      const rows = lines.slice(1) || [];
      return { headers, rows };
    }

    async function loadCollection() {
      try {
        const response = await fetch('records.json');
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        
        const data = await response.json();
        const records = data.records;
        
        const grid = document.getElementById('collectionGrid');
        grid.innerHTML = '';

        for (let index = 0; index < records.length; index++) {
          const record = records[index];
          const cardContainer = document.createElement('div');
          cardContainer.className = "perspective-1000 w-full h-[520px]";

          let mediaHtml = '';
          if (record.type === 'sound') {
            mediaHtml = `
              <div class="w-full h-56 bg-slate-900 text-slate-100 rounded-xl flex flex-col items-center justify-center p-4 text-center border border-slate-800">
                <span class="text-[10px] tracking-widest text-slate-400 uppercase mb-3">[ Sound Record ]</span>
                <audio controls class="w-full h-10"><source src="${record.file}" type="audio/mpeg">Your browser does not support audio.</audio>
              </div>`;
          } else if (record.type === 'video') {
            mediaHtml = `
              <div class="w-full h-56 bg-slate-900 text-slate-100 rounded-xl overflow-hidden relative flex flex-col items-center justify-center border border-slate-800">
                <span class="absolute top-2 left-3 text-[9px] tracking-widest text-slate-400 uppercase z-10 bg-slate-950/80 px-1.5 py-0.5 rounded">[ Video ]</span>
                <video controls preload="metadata" class="w-full h-full object-cover rounded-xl">
                  <source src="${record.file}" type="video/mp4">
                  <source src="${record.file}" type="video/webm">
                  Your browser does not support video.
                </video>
              </div>`;
          } else if (record.type === 'spreadsheet' || record.type === 'file') {
            let tableContent = '<div class="text-xs text-emerald-400 italic text-center my-auto">Loading table data...</div>';
            try {
              const csvRes = await fetch(record.file);
              if (csvRes.ok) {
                const csvText = await csvRes.text();
                const { headers, rows } = parseCSV(csvText);
                
                tableContent = `
                  <div class="w-full h-full overflow-auto text-[10px] font-mono">
                    <table class="w-full text-left border-collapse">
                      <thead>
                        <tr class="border-b border-emerald-900 bg-emerald-950/90 text-emerald-300">
                          ${headers.map(h => `<th class="p-1 truncate">${h}</th>`).join('')}
                        </tr>
                      </thead>
                      <tbody>
                        ${rows.map(row => `
                          <tr class="border-b border-emerald-950/50 hover:bg-emerald-900/20">
                            ${row.map(cell => `<td class="p-1 truncate text-emerald-100">${cell}</td>`).join('')}
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>`;
              }
            } catch (e) {
              tableContent = '<div class="text-xs text-red-400 text-center my-auto">Could not load CSV file.</div>';
            }

            mediaHtml = `
              <div class="w-full h-56 bg-slate-900 text-emerald-100 rounded-xl p-3 flex flex-col justify-between border border-emerald-900/60 overflow-hidden shadow-inner">
                <div class="flex justify-between items-center mb-1 shrink-0">
                  <span class="text-[9px] tracking-widest text-emerald-400 uppercase">[ Spreadsheet View ]</span>
                  <a href="${record.file}" download class="text-[9px] text-emerald-400 underline hover:text-white">Download</a>
                </div>
                <div class="w-full h-full bg-slate-950/60 rounded border border-emerald-900/40 p-1 overflow-hidden flex flex-col">
                  ${tableContent}
                </div>
              </div>`;
          } else if (record.type === 'text') {
            let textDisplay = record.content || record.text || record.body || '';
            
            if (!textDisplay && record.file) {
              try {
                const txtRes = await fetch(record.file);
                if (txtRes.ok) {
                  textDisplay = await txtRes.text();
                }
              } catch (e) {
                textDisplay = 'Could not load text file.';
              }
            }

            if (!textDisplay) {
              textDisplay = record.title || 'No text content provided.';
            }

            mediaHtml = `
              <div class="w-full h-56 bg-slate-900 rounded-xl border border-slate-800 p-4 overflow-y-auto text-slate-300 font-serif text-sm whitespace-pre-line">
                <span class="text-[10px] tracking-widest text-slate-500 uppercase block mb-2 font-mono">[ Text Record ]</span>
                <p>${textDisplay}</p>
              </div>`;
          } else {
            mediaHtml = `
              <div class="w-full h-56 bg-slate-900 rounded-xl border border-slate-800 flex flex-col items-center justify-center text-slate-500 overflow-hidden relative">
                <img src="${record.file}" alt="${record.title || 'Record Image'}" class="w-full h-full object-cover rounded-xl" onerror="this.onerror=null; this.parentNode.innerHTML='<span class=\\'text-xs text-slate-500\\'>Image failed to load</span>';"/>
              </div>`;
          }

          cardContainer.innerHTML = `
            <div id="cardInner-${index}" class="relative w-full h-full transform-style-3d transition-transform duration-700 ease-in-out">
              
              <!-- FRONT FACE (Dark Mode) -->
              <div class="absolute inset-0 w-full h-full bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-6 flex flex-col justify-between backface-hidden">
                <div class="flex flex-col gap-4">
                  ${mediaHtml}
                  <div class="space-y-1 mt-1">
                    <h2 class="text-xl font-bold text-slate-100 tracking-tight leading-snug line-clamp-1">
                      ${record.title || 'Untitled Record'}
                    </h2>
                    <p class="text-xs text-slate-400 font-normal line-clamp-1">
                      ${record.place || 'Unknown Location'} &bull; ${record.date || ''}
                    </p>
                  </div>
                </div>
                <div class="pt-4 border-t border-slate-800">
                  <button onclick="flipCard(${index})" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-slate-100 font-medium text-sm rounded-xl transition-all shadow-md focus:outline-none border border-slate-700">
                    Archive this
                  </button>
                </div>
              </div>

              <!-- BACK FACE (Archival Specimen Label in Dark Mode) -->
              <div class="absolute inset-0 w-full h-full bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-5 flex flex-col justify-between backface-hidden rotate-y-180 font-mono text-slate-200">
                <div class="w-full h-full border border-slate-700 p-4 flex flex-col justify-between bg-slate-950/70 rounded-sm">
                  <div>
                    <div class="flex justify-between items-baseline border-b border-slate-800 pb-2 mb-3">
                      <span class="text-[10px] tracking-widest text-slate-400 uppercase select-none">ARCHIVAL SPECIMEN</span>
                      <div class="text-right">
                        <span class="text-xs font-bold text-slate-200 tracking-wider">CAT. NO. ${record.id || '---'}</span>
                        <span class="block text-[9px] text-emerald-400 font-semibold tracking-normal mt-0.5">CERTAINTY: ${record.certainty || 'N/A'}</span>
                      </div>
                    </div>

                    <div class="space-y-2 text-xs leading-relaxed">
                      <div>
                        <div class="text-[9px] uppercase font-semibold text-slate-400 tracking-wider mb-0.5 select-none">Title</div>
                        <div class="field-value p-1 bg-slate-900 border-b border-slate-800 text-slate-100 truncate">
                          ${record.title || 'N/A'}
                        </div>
                      </div>
                      <div>
                        <div class="text-[9px] uppercase font-semibold text-slate-400 tracking-wider mb-0.5 select-none">Date and place</div>
                        <div class="field-value p-1 bg-slate-900 border-b border-slate-800 text-slate-100 truncate">
                          ${[record.date, record.place].filter(Boolean).join(' — ') || 'N/A'}
                        </div>
                      </div>
                      <div>
                        <div class="text-[9px] uppercase font-semibold text-slate-400 tracking-wider mb-0.5 select-none">Recorded by</div>
                        <div class="field-value p-1 bg-slate-900 border-b border-slate-800 text-slate-100 truncate">
                          ${record.recorder || 'N/A'}
                        </div>
                      </div>
                      <div>
                        <div class="text-[9px] uppercase font-semibold text-slate-400 tracking-wider mb-0.5 select-none">What was not captured</div>
                        <div class="field-value-delayed p-1 bg-slate-900 border-b border-slate-800 text-slate-300 italic text-[11px] h-12 overflow-y-auto">
                          ${record.not_captured || 'None noted.'}
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="pt-2 border-t border-slate-800 mt-auto">
                    <button onclick="flipCard(${index})" class="w-full py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 font-mono font-medium text-xs rounded transition-colors uppercase tracking-wider focus:outline-none border border-slate-700">
                      &larr; Return to specimen
                    </button>
                  </div>
                </div>
              </div>

            </div>
          `;
          grid.appendChild(cardContainer);
        }

      } catch (error) {
        console.error('Failed to load records.json:', error);
        document.getElementById('collectionGrid').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'block';
      }
    }

    function flipCard(index) {
      const cardInner = document.getElementById(`cardInner-${index}`);
      const isFlipped = cardInner.classList.toggle('rotate-y-180');

      if (isFlipped) {
        requestAnimationFrame(() => {
          cardInner.classList.add('is-decaying');
        });
      } else {
        cardInner.classList.remove('is-decaying');
      }
    }

    window.addEventListener('DOMContentLoaded', loadCollection);
  </script>

</body>
</html>
